<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面不存在 · dfangkai 的学习笔记</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='6' fill='%230E7466'/%3E%3Crect x='10' y='6' width='9' height='52' rx='3' fill='%230A5A4F'/%3E%3Cpath d='M27 22h19M27 31h19M27 40h12' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F2; --surface:#FFFFFF;
  --ink:#16201C; --muted:#5A6862; --line:#D6DED9;
  --accent:#0E7466; --accent-deep:#0A5A4F; --accent-soft:#D6EDE8;
  --glow:rgba(14,116,102,.11); --dot:rgba(22,32,28,.10);
  --shadow:0 1px 2px rgba(22,32,28,.04),0 6px 18px -12px rgba(22,32,28,.14);
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1412; --surface:#151D1A;
    --ink:#E1E9E5; --muted:#98A7A0; --line:#2A3632;
    --accent:#47C4AF; --accent-deep:#2E9A88; --accent-soft:#15322D;
    --glow:rgba(71,196,175,.10); --dot:rgba(225,233,229,.07);
    --shadow:0 1px 2px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-inline:20px;position:relative;overflow-x:hidden}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* 和首页一样的淡色光晕和点阵 */
.deco{position:absolute;inset:0 0 auto 0;height:440px;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 80% at 50% -10%,var(--glow),transparent 70%),
    radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(to bottom,#000 25%,transparent);
          mask-image:linear-gradient(to bottom,#000 25%,transparent)}
.page{position:relative;max-width:720px;margin:0 auto;padding-block:28px 48px}

.top{font-family:var(--f-mono);font-size:.8rem}
.brand{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;text-decoration:none}
.brand svg{width:20px;height:20px;display:block}
.brand .b{fill:var(--accent)} .brand .s{fill:var(--accent-deep)}

header{padding-block:72px 0}
.code{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.12em;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,7vw,3rem);line-height:1.2;margin:0;letter-spacing:.02em}
.lede{margin:.9rem 0 0;color:var(--muted);font-size:1.05rem;text-wrap:pretty}
.home{display:inline-flex;align-items:center;gap:8px;margin-top:32px;padding:10px 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:500;text-decoration:none;box-shadow:var(--shadow);transition:background .15s}
.home:hover{background:var(--accent-deep)}
@media (prefers-color-scheme: dark){ .home{color:var(--bg)} }
</style>
</head>
<body>
<div class="deco" aria-hidden="true"></div>
<div class="page">
  <div class="top">
    <a class="brand" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect class="b" x="10" y="6" width="44" height="52" rx="6"/><rect class="s" x="10" y="6" width="9" height="52" rx="3"/><path d="M27 22h19M27 31h19M27 40h12" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>dfangkai</a>
  </div>

  <header>
    <p class="code">404</p>
    <h1>这一页不存在</h1>
    <p class="lede">可能是地址打错了，或者这篇笔记换了地址。回到首页可以看到所有笔记。</p>
    <a class="home" href="/">← 回到首页</a>
  </header>
</div>
</body>
</html>
